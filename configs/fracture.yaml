data:
  dicom_root: iaaa-contest-bct/Data/training
  annotation_root: iaaa-contest-bct/Data/annotations
  corrected_annotation_root: iaaa-contest-bct/Data/annotations_corrected
  metadata_path: iaaa-contest-bct/Data/training_df.pkl
  # Volatile lossless rendered dataset; source DICOMs remain authoritative.
  output_root: /dev/shm/iaaa_fracture
  missing_json_means_negative: false
  series_id_column: dicom_series.id
  patient_id_column: dicom_series.PatientID
  sop_uid_column: dicom_series.SOPInstanceUID
  fracture_label_column: SkullFracture
  annotation_path_column: RelativeAnnotationPath
  annotation_version: fracture_dataset_v0_original
split: {seed: 42, validation_fraction: 0.2, num_folds: 5, path: splits/folds.json}
preprocessing:
  window_level: 500
  window_width: 2500
  image_size: 640
  input_mode: single
  boundary_mode: repeat
model:
  architecture: yolo11s
  weights: configs/yolo11s.yaml
  use_pretrained: false
  pretrained_weights_path: null
  weight_origin: random_initialization
  external_resource_approval_reference: null
training:
  epochs: 100
  batch_size: 1
  workers: 2
  patience: 20
  device: 0
  negative_downsample_ratio: 5
  augmentations:
    degrees: 5.0
    translate: 0.05
    scale: 0.10
    fliplr: 0.5
    flipud: 0.0
    perspective: 0.0
    mosaic: 0.0
    mixup: 0.0
    hsv_h: 0.0
    hsv_s: 0.0
    hsv_v: 0.05
  seed: 42
  wandb_mode: disabled
  amp: false
  plots: false
inference: {batch_size: 2, fp16: true, detection_confidence: 0.05, nms_iou: 0.5}
aggregation:
  method: max
  top_k: 3
  probability_thresholds: [0.1, 0.3, 0.5]
  model_path: null
calibration: {method: none, model_path: null}
